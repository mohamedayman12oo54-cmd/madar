# Security headers for nginx. Include this inside the `server { ... }` block that serves the built app
# (`include /path/to/security-headers.conf;`). It mirrors public/_headers, which serves the same headers on
# hosts that read that file (Netlify, Cloudflare Pages). Keep both in sync:
# src/lib/security.static.test.mjs fails if they drift apart.
#
# `always` adds the header to error responses too (404/500), not only to 200s.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Content-Security-Policy "frame-ancestors 'none'" always;
